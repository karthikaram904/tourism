<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Tourism</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="img/favicon.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(rgba(19,53,123,0.85), rgba(19,53,123,0.85)),
                        url('img/login-bg.jpg') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-box{
            background: #fff;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .login-box h1 {
  color: #13357B;
}
        .login-box h3{
            font-weight: 700;
        }
        .form-control{
            height: 50px;
        }
        .login-btn{
            background: #13357B;
            border: none;
        }
        .login-btn:hover{
            background: #0f2c66;
        }
        .navbar-brand.p-0 h1 {
  margin-bottom: 20px !important;
}
.d-grid .btn.btn-outline-dark:hover
{
    background: #0f2c66;
}

    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="login-box">

                <!-- Title -->
                <div class="text-center mb-4">
                    <a href="index.html" class="navbar-brand p-0">
                    <h1 class="m-0"><i class="fa fa-map-marker-alt me-3"></i>Tourism</h1>
                    <!-- <img src="img/logo.png" alt="Logo"> -->
                </a>
                    <h3>Login to Tourism</h3>
                    <p class="text-muted">Access your travel dashboard</p>
                </div>

                <!-- Login Form -->
                <form>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="Enter your password">
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">
                                Remember Me
                            </label>
                        </div>
                        <a href="#" class="text-decoration-none">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 login-btn">
                        Login
                    </button>
                </form>

                <!-- Divider -->
                <div class="text-center my-3">
                    <span class="text-muted">OR</span>
                </div>

                <!-- Social Login -->
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-dark">
                        <i class="fab fa-google me-2"></i>Login with Google
                    </button>
                    <button class="btn btn-outline-primary">
                        <i class="fab fa-facebook-f me-2"></i>Login with Facebook
                    </button>
                </div>

                <!-- Register -->
                <p class="text-center mt-4 mb-0">
                    Don’t have an account?
                    <a href="register.html" class="text-primary fw-bold">Sign Up</a>
                </p>

            </div>
        </div>
    </div>
</div>

</body>
</html>
