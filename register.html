<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Tourism</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="img/favicon.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(rgba(19,53,123,0.85), rgba(19,53,123,0.85)),
                        url('img/register-bg.jpg') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .register-box{
            background: #fff;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .register-box h1 {
  color: #13357B;
}
.d-grid .btn.btn-outline-dark:hover
{
    background: #0f2c66;
}
        .register-box h3{
            font-weight: 700;
        }
        .form-control{
            height: 50px;
        }
        .register-btn{
            background: #13357B;
            border: none;
        }
        .register-btn:hover{
            background: #0f2c66;
        }
        .navbar-brand.p-0 h1 {
  margin-bottom: 20px !important;
}
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="register-box">

                <!-- Title -->
                <div class="text-center mb-4">
                    <a href="index.html" class="navbar-brand p-0">
                    <h1 class="m-0"><i class="fa fa-map-marker-alt me-3"></i>Tourism</h1>
                    <!-- <img src="img/logo.png" alt="Logo"> -->
                </a>
                    <h3>Create Your Account</h3>
                    <p class="text-muted">Join Tourism & start exploring</p>
                </div>

                <!-- Register Form -->
                <form>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" placeholder="Enter first name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" placeholder="Enter last name">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" placeholder="Enter phone number">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="Create password">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" placeholder="Confirm password">
                        </div>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="terms">
                        <label class="form-check-label" for="terms">
                            I agree to the <a href="#">Terms & Conditions</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 register-btn">
                        Create Account
                    </button>
                </form>

                <!-- Divider -->
                <div class="text-center my-3">
                    <span class="text-muted">OR</span>
                </div>

                <!-- Social Register -->
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-dark">
                        <i class="fab fa-google me-2"></i>Sign up with Google
                    </button>
                    <button class="btn btn-outline-primary">
                        <i class="fab fa-facebook-f me-2"></i>Sign up with Facebook
                    </button>
                </div>

                <!-- Login Link -->
                <p class="text-center mt-4 mb-0">
                    Already have an account?
                    <a href="login.html" class="text-primary fw-bold">Login</a>
                </p>

            </div>
        </div>
    </div>
</div>

</body>
</html>
